<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>JSON/GeoJSON Editor</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Apple-style design layer. Must load after bootstrap so it can
     override its custom properties. Relative href so the page works
     under both the model server and Live Server. -->
<link href="../web/css/apple.css" rel="stylesheet">

<style>
body { height: 100vh; overflow: hidden; }
#editor { height: calc(100vh - 120px); overflow-y: auto; }
.breadcrumb-item button {
    border: none;
    background: none;
    padding: 0;
    color: #0d6efd;
}
.key-label { font-weight: 600; }
.array-index { color: #6c757d; }
</style>
</head>

<body class="bg-light">

<div class="container-fluid h-100">
<div class="row h-100">

<!-- Sidebar -->
<div class="col-3 bg-white border-end p-3">
    <h5 class="mb-3">JSON/GeoJSON Editor</h5>

    <div class="mb-3">
        <input type="file" class="form-control" id="fileInput">
    </div>

    <div class="d-grid gap-2">
        <button class="btn btn-success" onclick="saveFile()">Save</button>
        <button class="btn btn-primary" onclick="saveAsFile()">Save As...</button>
        <button class="btn btn-outline-secondary" onclick="goUp()">Go Up</button>
    </div>

    <hr>

    <nav>
        <ol class="breadcrumb" id="breadcrumbPath"></ol>
    </nav>
</div>

<!-- Editor -->
<div class="col-9 p-3">
    <div id="editor" class="card p-3"></div>
</div>

</div>
</div>

<script>

let geojsonData = null;
let currentPath = [];
let fileHandle = null;   // For File System Access API

document.getElementById("fileInput").addEventListener("change", async function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const text = await file.text();
    geojsonData = JSON.parse(text);
    currentPath = [];

    render();
});

function getCurrentNode() {
    return currentPath.reduce((obj, key) => obj[key], geojsonData);
}

function goUp() {
    if (currentPath.length > 0) {
        currentPath.pop();
        render();
    }
}

function renderBreadcrumb() {
    const breadcrumb = document.getElementById("breadcrumbPath");
    breadcrumb.innerHTML = "";

    const rootItem = document.createElement("li");
    rootItem.className = "breadcrumb-item";
    rootItem.innerHTML = `<button onclick="navigateTo([])">root</button>`;
    breadcrumb.appendChild(rootItem);

    currentPath.forEach((part, index) => {
        const li = document.createElement("li");
        li.className = "breadcrumb-item";
        const pathSlice = currentPath.slice(0, index + 1);
        li.innerHTML =
            `<button onclick='navigateTo(${JSON.stringify(pathSlice)})'>${part}</button>`;
        breadcrumb.appendChild(li);
    });
}

function navigateTo(path) {
    currentPath = path;
    render();
}

function render() {
    renderBreadcrumb();
    const editor = document.getElementById("editor");
    editor.innerHTML = "";
    if (!geojsonData) return;

    const node = getCurrentNode();

    if (typeof node !== "object" || node === null) {
        editor.innerHTML = `<div class="alert alert-info">${node}</div>`;
        return;
    }

    // Add button row
    const addRow = document.createElement("div");
    addRow.className = "mt-3";

    if (Array.isArray(node)) {
        addRow.innerHTML = `
            <button class="btn btn-sm btn-success mb-2"
                onclick="addArrayItem()">+ Add Item</button>
        `;
    } else {
        addRow.innerHTML = `
            <button class="btn btn-sm btn-success mb-2"
                onclick="addObjectField()">+ Add Field</button>
        `;
    }

    const list = document.createElement("div");
    list.className = "list-group";

    if (Array.isArray(node)) {
        node.forEach((item, index) => {
            const row = document.createElement("div");
            row.className = "list-group-item";

            row.innerHTML = `
                <div class="d-flex justify-content-between align-items-center">
                    <span class="array-index" ><a class="text-decoration-none" onclick="drillDown(${index})" href="#">
                        [${index}]</a>
                        </span>
                    <div>
                        <button class="btn btn-sm btn-outline-primary me-2"
                            onclick="drillDown(${index})">Open</button>
                        <button class="btn btn-sm btn-outline-danger"
                            onclick="deleteItem(${index})">Delete</button>
                    </div>
                </div>
            `;

            if (typeof item !== "object" || item === null) {
                const input = document.createElement("input");
                input.className = "form-control mt-2";
                input.value = item;
                input.onchange = (e) => node[index] = parseValue(e.target.value);
                row.appendChild(input);
            }

            list.appendChild(row);
            editor.appendChild(list);
            editor.appendChild(addRow);
        });
    } else {
        Object.keys(node).forEach(key => {
            const value = node[key];

            const row = document.createElement("div");
            row.className = "list-group-item";

            row.innerHTML = `
                <div class="d-flex justify-content-between align-items-center">
                    <span class="key-label"><a class="text-decoration-none" onclick="drillDown('${key}')">${key}</a></span>
                    <div>
                        ${typeof value === "object" && value !== null ?
                            `<button class="btn btn-sm btn-outline-primary me-2"
                                onclick="drillDown('${key}')">Open</button>` : ""}
                        <button class="btn btn-sm btn-outline-danger"
                            onclick="deleteKey('${key}')">Delete</button>
                    </div>
                </div>
            `;

            if (typeof value !== "object" || value === null) {
                const input = document.createElement("input");
                input.className = "form-control mt-2";
                input.value = value;
                input.onchange = (e) => node[key] = parseValue(e.target.value);
                row.appendChild(input);
            }

            list.appendChild(row);
        });
    }

    editor.appendChild(list);
}

function drillDown(key) {
    currentPath.push(key);
    render();
}

function deleteItem(index) {
    const node = getCurrentNode();
    node.splice(index, 1);
    render();
}

function deleteKey(key) {
    const node = getCurrentNode();
    delete node[key];
    render();
}

function parseValue(val) {
    try { return JSON.parse(val); }
    catch { return val; }
}

/* =========================
   SAVE FUNCTIONS
========================= */

async function saveFile() {
    if (fileHandle) {
        await writeFile(fileHandle);
    } else {
        saveAsFile();
    }
}

async function saveAsFile() {
    if ('showSaveFilePicker' in window) {
        fileHandle = await window.showSaveFilePicker({
            suggestedName: "edited.geojson",
            types: [{
                description: "GeoJSON",
                accept: { "application/json": [".geojson", ".json"] }
            }]
        });

        await writeFile(fileHandle);
    } else {
        fallbackDownload();
    }
}

async function writeFile(handle) {
    const writable = await handle.createWritable();
    await writable.write(JSON.stringify(geojsonData, null, 2));
    await writable.close();
    alert("File saved successfully.");
}

function fallbackDownload() {
    const blob = new Blob([JSON.stringify(geojsonData, null, 2)], {
        type: "application/json"
    });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "edited.geojson";
    a.click();
}
function addArrayItem() {
    const node = getCurrentNode();
    if (!Array.isArray(node)) return;

    const valueInput = prompt("Enter value for new item (JSON allowed). Leave empty for null:");
    let value = null;

    if (valueInput !== null && valueInput.trim() !== "") {
        value = parseValue(valueInput);
    }

    node.push(value);
    render();
}

function addObjectField() {
    const node = getCurrentNode();
    if (typeof node !== "object" || node === null || Array.isArray(node)) return;

    const key = prompt("Enter new field key:");
    if (!key) return;

    if (node.hasOwnProperty(key)) {
        alert("Key already exists.");
        return;
    }

    const valueInput = prompt("Enter value for this field (JSON allowed). Leave empty for null:");
    let value = null;

    if (valueInput !== null && valueInput.trim() !== "") {
        value = parseValue(valueInput);
    }

    node[key] = value;
    render();
}
</script>

</body>
</html>
