<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" name="referrer" content="strict-origin-when-cross-origin">
    <title>Set area</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.5.2/ol.css">
    <!-- Apple-style design layer. Must load after bootstrap so it can
         override its custom properties. Relative href so the page works
         under both the model server and Live Server. -->
    <link href="../web/css/apple.css" rel="stylesheet">
    <style>
        html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  display: flex;
  flex-direction: column; /* stack map and controls vertically */
}
        #controls { padding:10px; background:var(--ap-surface); border-bottom:1px solid var(--ap-hairline); display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
        #map {   flex: 1; width: 100%; }
        #instructions { font-size:12px; color:#555; margin-left:10px; }
        #progress { font-size:12px; color:green; margin-left:10px; }
        .overlay-container { background:white; padding:5px; border:1px solid gray; max-width:280px; z-index:1000; }
        .overlay-container input { margin-bottom:5px; }
    </style>
</head>
<body>

<div id="controls" class="container-fluid">
  <label class="btn btn-outline-secondary btn-sm me-2" for="fileInput">Import area</label>
  <input type="file" id="fileInput" accept=".geojson,.json" style="display:none;">
  
    <div class="d-flex align-items-center">
        <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Search Region" style="max-width:200px;">
        <input type="button" class="btn btn-outline-secondary btn-sm me-2" id="searchBtn" value="Search" onclick="searchRegion(1)">
        <select id="searchResults" class="form-select form-select-sm ms-1" style="max-width:200px; display:none;">
            <option value="">-- Select --</option>
        </select>
    </div>

    <button id="exportPolygonBtn" class="btn btn-primary btn-sm" disabled>Export Area</button>
    <span id="progress"></span>
</div>

<div id="instructions">
    <strong>Controls:</strong> Hold <code>Shift</code> + Click to add points | <strong>Double click</strong> to close loop.
</div>

<div id="map"></div>

<script src="https://cdn.jsdelivr.net/npm/ol@7.5.2/dist/ol.js"></script>
<script src="https://cdn.jsdelivr.net/npm/osmtogeojson@3.0.0-beta.5/osmtogeojson.js"></script>

<script>
/** * 1. MAP & LAYER CONFIGURATION */
const rasterLayer = new ol.layer.Tile({ source: new ol.source.OSM() });

const vectorSource = new ol.source.Vector();
const vectorLayer = new ol.layer.Vector({
    source: vectorSource,
    style: new ol.style.Style({
        stroke: new ol.style.Stroke({ color:'#e74c3c', width:3 }),
        fill: new ol.style.Fill({ color: 'rgba(231, 76, 60, 0.2)' })
    })
});

const roadsSource = new ol.source.Vector();
const roadsLayer = new ol.layer.Vector({
    source: roadsSource,
    style: new ol.style.Style({ stroke: new ol.style.Stroke({ color:'#3498db', width:2 }) })
});

const map = new ol.Map({
    target: 'map',
    layers: [rasterLayer, vectorLayer, roadsLayer],
    view: new ol.View({ center: ol.proj.fromLonLat([0, 0]), zoom: 2 })
});

// Update Buttons
function updateExportButtons() {
    const hasPolygon = vectorSource.getFeatures().length > 0;
    document.getElementById('exportPolygonBtn').disabled = !hasPolygon;
}
vectorSource.on('addfeature', updateExportButtons);
vectorSource.on('removefeature', updateExportButtons);


/** * 2. DRAWING INTERACTION (CUSTOM RULES) */
let tempDrawnFeature = null;
let overlay = null;
let previousExtent = null;

let lastClickTime = 0;

const draw = new ol.interaction.Draw({
    source: vectorSource,
    type: 'Polygon',
    // finishCondition is checked when a click could potentially close the polygon
    finishCondition: (evt) => {
        const currentTime = new Date().getTime();
        const timeDiff = currentTime - lastClickTime;
        lastClickTime = currentTime;

        // Only allow finishing if the clicks happened within 300ms of each other
        // This effectively ignores slow double-clicks.
        return timeDiff < 300; 
    }, 
    snapTolerance: 10, 
    pixelTolerance: 5,
    freehandCondition: evt => evt.originalEvent.shiftKey && evt.type === 'pointerdrag',
    condition: evt => evt.originalEvent.shiftKey
});
map.addInteraction(draw);

draw.on('drawstart', evt => {
    tempDrawnFeature = evt.feature;
    if(overlay) { map.removeOverlay(overlay); overlay = null; }
    const feats = vectorSource.getFeatures();
    if(feats.length > 0) previousExtent = feats[0].getGeometry().getExtent();
});

draw.on('drawend', evt => {
    tempDrawnFeature = evt.feature;
    setTimeout(() => {
        const coords = tempDrawnFeature.getGeometry().getCoordinates()[0][0];
        overlay = createAcceptCancelOverlay(coords);
        map.addOverlay(overlay);
    }, 100);
});

function createAcceptCancelOverlay(position) {
    const container = document.createElement('div');
    container.className = 'overlay-container';

    const acceptBtn = document.createElement('button');
    acceptBtn.className = 'btn btn-success btn-sm me-2';
    acceptBtn.innerText = 'Accept Area';
    acceptBtn.onclick = () => {
        vectorSource.clear();
        vectorSource.addFeature(tempDrawnFeature);
        map.getView().fit(tempDrawnFeature.getGeometry().getExtent(), { padding:[60,60,60,60], duration:600 });
        tempDrawnFeature = null;
        if(overlay) { map.removeOverlay(overlay); overlay = null; }
        updateExportButtons();
    };

    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn btn-danger btn-sm';
    cancelBtn.innerText = 'Cancel';
    cancelBtn.onclick = () => {
        if(tempDrawnFeature) vectorSource.removeFeature(tempDrawnFeature);
        tempDrawnFeature = null;
        if(overlay) { map.removeOverlay(overlay); overlay = null; }
        if(previousExtent) map.getView().fit(previousExtent, { padding:[40,40,40,40], duration:600 });
        updateExportButtons();
    };

    container.appendChild(acceptBtn);
    container.appendChild(cancelBtn);

    return new ol.Overlay({
        element: container,
        position: position,
        positioning: 'bottom-left',
        stopEvent: true,
        offset: [10, -10]
    });
}

/** * 3. SEARCH & IMPORT LOGIC */
document.getElementById('fileInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
        try {
            const geojson = JSON.parse(ev.target.result);
            const features = new ol.format.GeoJSON().readFeatures(geojson, { featureProjection:'EPSG:3857' });
            vectorSource.clear();
            vectorSource.addFeatures(features);
            if(features.length) map.getView().fit(vectorSource.getExtent(), { padding:[40,40,40,40], duration:600 });
            updateExportButtons();
        } catch(err) { alert("Invalid GeoJSON file."); }
    };
    reader.readAsText(file);
});

let relations = [];
const progress = document.getElementById('progress');

async function searchRegion(tryCount){
    const query = document.getElementById('searchInput').value.trim();
    if(!query || query.length < 3) return;
    progress.style.color = 'green';
    progress.textContent = "Search attempt " + String(tryCount) + " of 10"

    try {
        const overpassQuery = `[out:json][timeout:1000];relation["boundary"="administrative"]["name"~"${query}",i];out tags;`;
        const res = await fetch("https://overpass-api.de/api/interpreter", { method: "POST", body: overpassQuery });
        const data = await res.json();
        relations = data.elements;
        populateResults(relations);
        progress.textContent = ""
    } catch(err) {if (tryCount < 10) {searchRegion(tryCount + 1)} else {alert("Search failed after multiple attempts.")} 

    }
}


function populateResults(relations){
    const select = document.getElementById('searchResults');
    select.innerHTML = '<option value="">-- Select Result --</option>';
    if(relations.length === 0) { select.style.display = 'none'; return; }
    relations.forEach((rel, i) => {
        const opt = document.createElement('option');
        opt.text = `${rel.tags.name} (L${rel.tags.admin_level || '?'})`;
        opt.value = i;
        select.appendChild(opt);
    });
    select.style.display = 'inline-block';
}

async function getBoundary(value, tryCount){
    if(value === "") return;
    const rel = relations[value];
    progress.style.color = 'green';
    progress.textContent = "Fetching Boundary";
    try {
        const res = await fetch("https://overpass-api.de/api/interpreter", { 
            method: "POST", body: `[out:json];relation(${rel.id});out geom;` 
        });
        const data = await res.json();
        const geojson = osmtogeojson(data);
        vectorSource.clear();
        vectorSource.addFeatures(new ol.format.GeoJSON().readFeatures(geojson, { featureProjection:'EPSG:3857' }));
        map.getView().fit(vectorSource.getExtent(), { padding: [40, 40, 40, 40] });
    } catch(err) { alert("Fetch failed.")}
    finally { progress.textContent = ""};
}


document.getElementById('searchResults').addEventListener('change', function() {
    getBoundary(this.value, 1);
    this.selectedIndex = 0; 
});


/** * 4. EXPORT LOGIC */
function triggerDownload(content, filename, type) {
    const blob = new Blob([content], { type: type });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
}

function convertToGraphML(data) {
    let nodesXml = '';
    let edgesXml = '';
    const nodeMap = new Set();
    const nodes = data.elements.filter(e => e.type === 'node');
    
    nodes.forEach(node => {
        nodeMap.add(node.id);
        nodesXml += `    <node id="${node.id}"><data key="y">${node.lat}</data><data key="x">${node.lon}</data></node>\n`;
    });

    const ways = data.elements.filter(e => e.type === 'way');
    ways.forEach(way => {
        if (!way.nodes) return;
        const h = way.tags ? (way.tags.highway || 'road') : 'road';
        for (let i = 0; i < way.nodes.length - 1; i++) {
            const u = way.nodes[i];
            const v = way.nodes[i+1];
            if (nodeMap.has(u) && nodeMap.has(v)) {
                edgesXml += `    <edge id="e${way.id}_${i}" source="${u}" target="${v}"><data key="highway">${h}</data></edge>\n`;
            }
        }
    });

    return `<?xml version="1.0" encoding="UTF-8"?>
<graphml xmlns="http://graphml.graphdrawing.org/xmlns">
  <key id="y" for="node" attr.name="y" attr.type="string"/><key id="x" for="node" attr.name="x" attr.type="string"/>
  <key id="highway" for="edge" attr.name="highway" attr.type="string"/>
  <graph id="G" edgedefault="directed">
${nodesXml}${edgesXml}  </graph>
</graphml>`;
}

document.getElementById('exportPolygonBtn').addEventListener('click', () => {
    const geojson = new ol.format.GeoJSON().writeFeatures(vectorSource.getFeatures(), { 
        featureProjection:'EPSG:3857', dataProjection:'EPSG:4326' 
    });
    triggerDownload(geojson, 'area.geojson', 'application/json');
});




</script>
</body>
</html>
