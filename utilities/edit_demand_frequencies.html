<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demand Frequency Editor Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Apple-style design layer. Must load after bootstrap so it can
         override its custom properties. Relative href so the page works
         under both the model server and Live Server. -->
    <link href="../web/css/apple.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { background-color: var(--ap-bg); padding-top: 2rem; padding-bottom: 5rem; }
        .card { box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); margin-bottom: 1.5rem; }
        .frequency-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 5px; }
        .day-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .freq-input { text-align: center; padding: 2px; font-size: 0.8rem; }
        label { font-size: 0.75rem; font-weight: bold; color: #6c757d; display: block; text-align: center; }
        .combination-row { border-left: 4px solid #0d6efd; transition: all 0.2s; }
        .combination-row:hover { background-color: var(--ap-surface); transform: translateX(5px); }
        #fileStatus { font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="row mb-4">
        <div class="col-md-12">
            <h2 class="display-6">Demand Configuration</h2>
        </div>
    </div>

    <div class="card p-3 mb-4">
        <div class="d-flex flex-wrap align-items-center gap-2">
            <button class="btn btn-outline-primary" onclick="document.getElementById('geoInput').click()">1. Import GeoJSON</button>
            <input type="file" id="geoInput" accept=".geojson,.json" hidden>
            
            <div class="vr mx-2"></div>

            <button class="btn btn-outline-secondary" id="openFileBtn" onclick="document.getElementById('configInput').click()">2: Open Config File</button>
            <input type="file" id="configInput" accept=".geojson,.json" hidden>
            <button class="btn btn-success" id="saveFileBtn">Save Config</button>
            <button class="btn btn-outline-danger" id="saveAsBtn">Save As...</button>

            <button class="btn btn-primary ms-auto" id="addComboBtn" disabled>+ Add Combination</button>
        </div>
        <div class="d-flex justify-content-between mt-3">
            <div id="categoryBadgeContainer"></div>
            <div id="fileStatus" class="text-secondary italic">No file linked</div>
        </div>
    </div>

    <div class="card p-3">
        <div class="text-center py-5 text-muted" id="emptyState">
            <h5>No combinations defined.</h5>
            <p>Import a GeoJSON file first to see available categories.</p>
        </div>
        
        <div id="combinationsList"></div>
    </div>
</div>

<div class="modal fade" id="comboModal" data-bs-backdrop="static" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Edit Combination</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="cloneSection" class="alert alert-light border mb-4">
                    <div class="row align-items-center">
                        <div class="col-md-4 small fw-bold">Copy frequencies from existing:</div>
                        <div class="col-md-6">
                            <select id="cloneSelect" class="form-select form-select-sm">
                                <option value="">-- Select combination to copy --</option>
                            </select>
                        </div>
                        <div class="col-md-2 text-end">
                            <button class="btn btn-sm btn-outline-primary w-100" id="applyCloneBtn">Apply</button>
                        </div>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label class="text-start">Source Category</label>
                        <select id="modalSource" class="form-select"></select>
                    </div>
                    <div class="col-md-6">
                        <label class="text-start">Destination Category</label>
                        <select id="modalDest" class="form-select"></select>
                    </div>
                </div>

                <h6>Hourly Frequencies (00:00 - 23:00)</h6>
                <div class="frequency-grid mb-4" id="hourlyInputs"></div>

                <h6>Weekly Frequencies (Mon - Sun)</h6>
                <div class="day-grid mb-4" id="weeklyInputs"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveComboBtn">Save Combination</button>
            </div>
        </div>
    </div>
</div>

<script>
    let categories = [];
    let combinations = [];
    let currentEditId = null;
    let fileHandle = null; 
    let comboModal;
    const DEFAULT_FILENAME = "demand_frequencies.json"; // Your default filename

    const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

    document.addEventListener('DOMContentLoaded', () => {
        comboModal = new bootstrap.Modal(document.getElementById('comboModal'));
        initInputs();
    });

    function initInputs() {
        const hContainer = document.getElementById('hourlyInputs');
        hContainer.innerHTML = '';
        for (let i = 0; i < 24; i++) {
            hContainer.innerHTML += `<div><label>${i}:00</label><input type="number" step="0.1" min="0" value="1" class="form-control freq-input hour-val" data-idx="${i}"></div>`;
        }
        const wContainer = document.getElementById('weeklyInputs');
        wContainer.innerHTML = '';
        days.forEach((day, i) => {
            wContainer.innerHTML += `<div><label>${day}</label><input type="number" step="0.1" min="0" value="1" class="form-control freq-input day-val" data-idx="${i}"></div>`;
        });
    }

    // --- FILE SYSTEM API HELPERS ---
async function getFileHandle(isSaveAs = false) {
    const opts = {
        suggestedName: DEFAULT_FILENAME,
        types: [{
            description: 'JSON Config',
            accept: { 'application/json': ['.json'] }
        }],
    };

    // If we have a previous fileHandle, we use it as the starting point
    if (fileHandle && !isSaveAs) {
        // Just return the existing handle for a direct "Save"
        return fileHandle;
    }

    // If "Save As" or no handle exists, prompt user
    // we use the existing handle to "startIn" the last known location
    if (fileHandle) {
        opts.startIn = fileHandle;
    }

    const newHandle = await window.showSaveFilePicker(opts);
    fileHandle = newHandle; // Update global "last used" handle
    return fileHandle;
}

document.getElementById('openFileBtn').onclick = async () => {
    try {
        const opts = {
            types: [{ accept: { 'application/json': ['.json'] } }]
        };
        
        // Suggest the last known location if available
        if (fileHandle) {
            opts.startIn = fileHandle;
        }

        const [newHandle] = await window.showOpenFilePicker(opts);
        fileHandle = newHandle; // Remember this location/file
        
        const file = await fileHandle.getFile();
        combinations = JSON.parse(await file.text());
        document.getElementById('fileStatus').textContent = `Linked: ${file.name}`;
        renderList();
    } catch (e) { 
        console.error("Open cancelled or failed", e); 
    }
};

const saveFile = async (isSaveAs = false) => {
    try {
        const handle = await getFileHandle(isSaveAs);
        const writable = await handle.createWritable();
        await writable.write(JSON.stringify(combinations, null, 2));
        await writable.close();
        
        const fileData = await handle.getFile();
        document.getElementById('fileStatus').textContent = `Saved: ${fileData.name}`;
    } catch (e) { 
        console.error("Save cancelled or failed", e); 
    }
};

    document.getElementById('saveFileBtn').onclick = () => saveFile(false);
    document.getElementById('saveAsBtn').onclick = () => saveFile(true);

    // --- GEOJSON LOGIC ---
    document.getElementById('geoInput').onchange = (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (ev) => {
            const data = JSON.parse(ev.target.result);
            const cats = new Set();
            data.features.forEach(f => { if (f.properties?.category) cats.add(f.properties.category); });
            categories = Array.from(cats);
            updateCategoryUI();
            document.getElementById('addComboBtn').disabled = false;
        };
        reader.readAsText(file);
    };

    function updateCategoryUI() {
        const container = document.getElementById('categoryBadgeContainer');
        container.innerHTML = '<span class="me-2 small text-uppercase fw-bold">Categories:</span>';
        categories.forEach(c => container.innerHTML += `<span class="badge bg-info text-dark me-1">${c}</span>`);
        ['modalSource', 'modalDest'].forEach(id => {
            document.getElementById(id).innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
        });
    }

    // --- COMBINATION & CLONE LOGIC ---
    document.getElementById('addComboBtn').onclick = () => {
        currentEditId = null;
        document.getElementById('modalTitle').textContent = "Add Combination";
        document.querySelectorAll('.freq-input').forEach(i => i.value = 1);
        updateCloneDropdown();
        comboModal.show();
    };

    function updateCloneDropdown() {
        const select = document.getElementById('cloneSelect');
        select.innerHTML = '<option value="">-- Select combination to copy --</option>';
        combinations.forEach(c => {
            if (c.id !== currentEditId) {
                select.innerHTML += `<option value="${c.id}">${c.source} → ${c.destination}</option>`;
            }
        });
    }

    document.getElementById('applyCloneBtn').onclick = () => {
        const targetId = document.getElementById('cloneSelect').value;
        if (!targetId) return;
        const source = combinations.find(c => c.id == targetId);
        if (source) {
            document.querySelectorAll('.hour-val').forEach((input, i) => input.value = source.hourly[i]);
            document.querySelectorAll('.day-val').forEach((input, i) => input.value = source.weekly[i]);
        }
    };

    document.getElementById('saveComboBtn').onclick = () => {
        const combo = {
            id: currentEditId || Date.now(),
            source: document.getElementById('modalSource').value,
            destination: document.getElementById('modalDest').value,
            hourly: Array.from(document.querySelectorAll('.hour-val')).map(i => parseFloat(i.value) || 0),
            weekly: Array.from(document.querySelectorAll('.day-val')).map(i => parseFloat(i.value) || 0)
        };
        if (currentEditId) combinations = combinations.map(c => c.id === currentEditId ? combo : c);
        else combinations.push(combo);
        comboModal.hide();
        renderList();
    };

function renderList() {
    const listContainer = document.getElementById('combinationsList');
    const emptyState = document.getElementById('emptyState');

    if (combinations.length === 0) {
        emptyState.classList.remove('d-none');
        listContainer.innerHTML = '';
        return;
    }

    // Hide the empty state but DON'T delete it from the DOM
    emptyState.classList.add('d-none');

    // Update only the list container
    listContainer.innerHTML = combinations.map(c => `
        <div class="card combination-row p-3 mb-2 bg-light">
            <div class="d-flex align-items-center justify-content-between">
                <div>
                    <span class="badge bg-primary px-3">${c.source}</span>
                    <span class="mx-2 text-muted">→</span>
                    <span class="badge bg-success px-3">${c.destination}</span>
                </div>
                <div>
                    <button class="btn btn-sm btn-outline-dark" onclick="editCombo(${c.id})">Edit</button>
                    <button class="btn btn-sm btn-outline-danger ms-1" onclick="deleteCombo(${c.id})">Delete</button>
                </div>
            </div>
        </div>`).join('');
}

    window.editCombo = (id) => {
        const c = combinations.find(x => x.id === id);
        currentEditId = id;
        document.getElementById('modalTitle').textContent = "Edit Combination";
        document.getElementById('modalSource').value = c.source;
        document.getElementById('modalDest').value = c.destination;
        document.querySelectorAll('.hour-val').forEach((input, i) => input.value = c.hourly[i]);
        document.querySelectorAll('.day-val').forEach((input, i) => input.value = c.weekly[i]);
        updateCloneDropdown();
        comboModal.show();
    };

    window.deleteCombo = (id) => { if (confirm("Delete?")) { combinations = combinations.filter(c => c.id !== id); renderList(); } };
</script>
</body>
</html>
